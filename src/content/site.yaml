# Site-wide settings. Brielle edits these in Pages CMS.
# Anything in [square brackets] is a placeholder waiting for real details.

name: Summerhays Dance
instructorName: Brielle
positioning: For teens and adults who are serious about dancing, not about competing.
description: Hip hop, jazz and contemporary classes for teens and adults in [City], Utah. Serious about dancing, not about competing.
city: "[City]"
state: Utah
email: "[hello@yourdomain.com]"
phone: ""

# Until classes open, keep this on. Every Book button then becomes
# "Join the waitlist" and the live booking schedule is hidden.
prelaunch: true

bookLabel: Book a class
waitlistLabel: Join the waitlist

introOffer:
  enabled: true
  text: "New here? 2 classes in 3 weeks for $25"
  linkText: Claim the intro offer
  prelaunchText: "Classes open soon:"
  prelaunchLinkText: join the waitlist

nav:
  - label: Dance Again
    href: /dance-again
  - label: Teens
    href: /teens
  - label: Schedule & Pricing
    href: /schedule
  - label: About
    href: /about

footerLinks:
  - label: Your First Class
    href: /first-class
  - label: Parties & Privates
    href: /parties
  - label: Contact
    href: /contact
  - label: Policies
    href: /policies

# The email signup used in the footer, the signup band and the waitlist page.
signup:
  heading: Get first dibs on new sessions
  text: Sessions are small and fill up. Get an email the day booking opens, before anyone else.
  firstNameLabel: First name
  emailLabel: Email
  interestLabel: I'm interested in
  interestOptions:
    - Dance Again (adults)
    - Teen Studio
    - Both
  buttonLabel: Sign up
  note: One email per session. Unsubscribe any time.
  successMessage: You're on the list. Watch your inbox for the next session.

formErrorMessage: "Something went wrong and your message didn't send. Please try again, or email us directly."

# Small interface wording. Most of it is only read aloud by screen readers.
ui:
  skipLink: Skip to content
  menu: Menu
  mainNavLabel: Main
  footerNavLabel: More pages
  photoLabel: "Photo:"
  pauseVideo: Pause video
  playVideo: Play video
  bookClass: Book
  honeypot: Leave this field empty
  scheduleColumns:
    day: Day
    time: Time
    className: Class
    level: Level
    location: Location
    book: Book

# Leave a link blank to hide that icon.
social:
  instagram: ""
  tiktok: ""
  facebook: ""
  youtube: ""

# Booking tool (Momence or OfferingTree). Filled in during pass 5.
booking:
  url: ""
  embedCode: ""

# Form service and email tool addresses. Filled in during pass 5.
forms:
  contactAction: ""
  inquiryAction: ""
  emailSignupAction: ""

# Cookie-free analytics (Plausible or Cloudflare Web Analytics). Off by default.
analytics:
  enabled: false
  scriptSrc: ""
  dataDomain: ""
