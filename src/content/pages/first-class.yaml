title: Your First Class
description: What to expect at your first Summerhays Dance class, what to wear and bring, parking and arrival, and answers to common questions.
heading: Your first class
intro: Nervous? Everyone is. Here's exactly what happens, so there are no surprises.
timeline:
  heading: What to expect
  items:
    - time: Before class
      title: Arrive 10 minutes early
      text: Say hi to Brielle, sign the waiver if you haven't online, and find a spot.
    - time: First 10 minutes
      title: Warm-up
      text: Easy stretching and movement to get your body ready. Go at your own pace.
    - time: Next 15 minutes
      title: Technique and across the floor
      text: A few key moves for the style, broken down slowly.
    - time: Next 25 minutes
      title: Choreography
      text: Learn a short routine step by step, adding a little each time.
    - time: Last 10 minutes
      title: Put it together
      text: Run it with the music a few times, then a cool-down stretch.
wear:
  heading: What to wear and bring
  items:
    - title: Clothes
      text: Anything comfortable you can move in. Leggings, joggers, shorts, T-shirts all work.
    - title: Shoes
      text: Clean sneakers for hip hop. Socks or bare feet for jazz and contemporary to start.
    - title: Bring
      text: A water bottle. A small towel if you like.
